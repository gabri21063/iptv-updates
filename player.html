<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPTV Web Player</title>
<style>
:root{--accent:#E94560;--bg1:#0f1023;--bg2:#1a1b30;--card:#232540;--txt:#e6e8f0;--dim:#9aa3bd}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(160deg,#0f1023,#1a1b30 60%,#101a33);color:var(--txt);font-family:"Segoe UI",Roboto,Arial,sans-serif;height:100vh;display:flex;flex-direction:column}
header{padding:14px 18px;display:flex;align-items:center;gap:14px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{width:42px;height:42px;border-radius:12px;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logo svg{width:20px;height:20px}
.logo svg polygon{fill:var(--accent)}
h1{font-size:18px;font-weight:800}
h1 span{color:var(--accent)}
.sub{font-size:11px;color:var(--dim);margin-top:2px}
.spacer{flex:1}
select.lang{background:var(--bg2);color:var(--txt);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 8px;font-size:12px}
main{flex:1;display:flex;min-height:0}
aside{width:290px;max-width:40%;overflow-y:auto;background:rgba(0,0,0,.18);padding:12px;display:flex;flex-direction:column;gap:10px}
.controls{display:flex;flex-direction:column;gap:8px}
.controls input[type=text]{background:var(--bg2);border:1px solid rgba(255,255,255,.12);color:var(--txt);border-radius:8px;padding:10px 12px;font-size:13px}
.controls input[type=file]{font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;cursor:pointer;flex:1}
.btn.ghost{background:var(--card);color:var(--txt)}
.btn:active{transform:scale(.97)}
.search{background:var(--bg2);border:1px solid rgba(255,255,255,.12);color:var(--txt);border-radius:8px;padding:9px 12px;font-size:13px}
.groups{display:flex;flex-wrap:wrap;gap:6px}
.g{background:var(--card);border:0;color:var(--dim);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
.g.on{background:var(--accent);color:#fff}
.channels{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.ch{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;cursor:pointer}
.ch:active{background:var(--card)}
.ch.playing{border-color:var(--accent)}
.ch img{width:30px;height:30px;border-radius:6px;object-fit:contain;background:rgba(0,0,0,.35);flex:0 0 auto}
.ch b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ll{background:var(--card);border:1px solid rgba(255,255,255,.15);color:var(--dim);border-radius:8px;padding:8px 12px;font-size:15px;cursor:pointer;line-height:1}
.ll.on{background:#22c55e;color:#fff;border-color:#22c55e}
.video{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;min-width:0}
video{width:100%;height:100%;max-height:100%;background:#000;border-radius:10px;outline:none}
.empty{color:var(--dim);text-align:center;line-height:1.7;font-size:14px;padding:20px}
.empty b{display:block;font-size:22px;color:var(--txt);margin-bottom:8px}
.empty b.err{font-size:14px;color:#ff7b7b;white-space:normal;max-width:640px;padding:8px}
.hint{font-size:12px;color:var(--dim)}
@media(max-width:820px){main{flex-direction:column}aside{width:100%;max-width:none;max-height:45%}.video{min-height:200px}}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 24 24"><polygon points="8,5 8,19 19,12"/></svg></div>
  <div>
    <h1>IPTV <span>Web Player</span></h1>
    <div class="sub" data-i18n="sub">Lettore M3U/M3U8 in browser — funziona su iPhone, Android e PC</div>
  </div>
  <div class="spacer"></div>
  <button class="ll" id="llbtn" title="Ultra-low latency WebRTC">⚡</button>
  <select class="lang" id="lang">
    <option value="it">🇮🇹 Italiano</option>
    <option value="en">🇬🇧 English</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="fr">🇫🇷 Français</option>
  </select>
</header>
<main>
  <aside>
    <div class="controls">
      <div class="row">
        <input type="text" id="m3uUrl" placeholder="https://.../playlist.m3u" data-i18n-placeholder="ph"><br>
        <button class="btn" id="loadBtn" data-i18n="load">Carica</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="fileBtn" data-i18n="file">Apri file .m3u</button>
      </div>
      <input type="file" id="file" accept=".m3u,.m3u8,audio/x-mpegurl,video/mp2t" style="display:none">
      <input type="text" class="search" id="search" data-i18n-placeholder="searchph">
    </div>
    <div class="groups" id="groups"></div>
    <div class="channels" id="channels"></div>
  </aside>
  <section class="video">
    <video id="video" controls playsinline></video>
    <div class="empty" id="empty">
      <b>📺 IPTV Web Player</b>
      <span data-i18n="intro">Incolla l'URL di una playlist M3U/M3U8 oppure apri un file locale, poi scegli un canale.</span>
    </div>
  </section>
</main>
<script>
(function(){
  var L={it:{sub:"Lettore M3U/M3U8 in browser — funziona su iPhone, Android e PC",ph:"https://.../playlist.m3u",load:"Carica",file:"Apri file .m3u",searchph:"🔍 Cerca canale...",intro:"Incolla l'URL di una playlist M3U/M3U8 oppure apri un file locale, poi scegli un canale.",err:"Errore playlist",noplaylists:"Nessuna playlist da caricare",noplay:"Incolla un URL M3U per iniziare"},
  en:{sub:"Browser M3U/M3U8 player — works on iPhone, Android and PC",ph:"https://.../playlist.m3u",load:"Load",file:"Open .m3u file",searchph:"🔍 Search channel...",intro:"Paste an M3U/M3U8 playlist URL or open a local file, then pick a channel.",err:"Playlist error",noplaylists:"No playlist to load",noplay:"Paste an M3U URL to start"},
  de:{sub:"M3U/M3U8-Player im Browser — läuft auf iPhone, Android und PC",ph:"https://.../playlist.m3u",load:"Laden",file:"Datei .m3u öffnen",searchph:"🔍 Sender suchen...",intro:"Füge eine M3U/M3U8-Playlist-URL ein oder öffne eine lokale Datei und wähle einen Sender.",err:"Playlist-Fehler",noplaylists:"Keine Playlist zum Laden",noplay:"M3U-URL einfügen zum Starten"},
  fr:{sub:"Lecteur M3U/M3U8 dans le navigateur — fonctionne sur iPhone, Android et PC",ph:"https://.../playlist.m3u",load:"Charger",file:"Ouvrir un fichier .m3u",searchph:"🔍 Rechercher une chaîne...",intro:"Collez l'URL d'une playlist M3U/M3U8 ou ouvrez un fichier local, puis choisissez une chaîne.",err:"Erreur de playlist",noplaylists:"Aucune playlist à charger",noplay:"Collez une URL M3U pour commencer"}};
  var lang="it";
  var channels=[];
  var groups=[];
  var currentGroup="";
  var filters={};

  function t(k){return (L[lang]&&L[lang][k])||L.it[k]||k}

  function applyLang(){
    document.querySelectorAll("[data-i18n]").forEach(function(el){el.textContent=t(el.getAttribute("data-i18n"))});
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el){el.placeholder=t(el.getAttribute("data-i18n-placeholder"))});
  }
  document.getElementById("lang").addEventListener("change",function(e){lang=e.target.value;applyLang()});

  document.getElementById("loadBtn").addEventListener("click",function(){
    var u=document.getElementById("m3uUrl").value.trim();
    if(u) fetchPlaylist(u);
  });
  document.getElementById("m3uUrl").addEventListener("keydown",function(e){if(e.key==="Enter")loadFromInput()});
  function loadFromInput(){var u=document.getElementById("m3uUrl").value.trim();if(u)fetchPlaylist(u)}
  document.getElementById("fileBtn").addEventListener("click",function(){document.getElementById("file").click()});
  document.getElementById("file").addEventListener("change",function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){parsePlaylist(r.result,f.name)};
    r.readAsText(f);
  });
  document.getElementById("search").addEventListener("input",render);
  document.getElementById("groups").addEventListener("click",function(e){
    var g=e.target.closest(".g");if(!g)return;
    currentGroup=g.getAttribute("data-g");renderGroups();
    render();
  });
  document.getElementById("channels").addEventListener("click",function(e){
    var c=e.target.closest(".ch");if(!c)return;
    var id=+c.getAttribute("data-id");
    var ch=channels.find(function(x){return x.id===id});
    if(ch)play(ch);
  });

  function playlistFileHeader(lines){
    for(var i=0;i<lines.length;i++){var s=lines[i].trim();if(s==="")return i}
    return -1
  }

  function fetchPlaylist(url){
    document.getElementById("empty").style.display="block";
    document.getElementById("empty").querySelector("b").textContent=t("err")+"…";
    if(url.indexOf("type=m3u_plus")>=0&&url.indexOf("output=hls")<0&&url.indexOf("output=ts")<0&&url.indexOf("output=m3u8")<0){
      url=url+(url.indexOf("?")>=0?"&":"?")+"output=hls";
    }
    var isHttp=/^http:\/\//i.test(url);
    if(isHttp&&location.protocol==="https:"){
      showError("📛 Playlist <b>http://</b> su pagina HTTPS: il browser la blocca (Mixed Content). Usa questo player dal box: nella tua app premi il tasto del <b>Web Server</b> e apri <b>http://IP:8080/player</b> (es. iPhone sulla stessa Wi-Fi).");
      return;
    }
    fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
      .then(function(text){parsePlaylist(text,url.split("/").pop())})
      .catch(function(){
        showError("🎬 " + t("err") + ". Se la lista è <b>http://</b> su pagina HTTPS viene bloccata: usa la versione dal box (vedi app → Web Server → http://IP:8080/player).");
      });
  }

  function parsePlaylist(text,name){
    var lines=text.split(/\r?\n/);
    channels=[];
    var curGroup="";
    var attrs={};
    var base=location.href;
    var ln=lines.length;
    function resolve(u){
      u=u.trim();
      if(/^[a-z]+:/i.test(u))return u;
      var i=base.indexOf("/",8);var origin=base.substring(0,i>0?i:base.length);
      if(u.indexOf("://")>0)return u;
      if(u.startsWith("/"))return origin+u;
      var path=base;
      var idx=path.indexOf("?");if(idx>=0)path=path.substring(0,idx);
      var slash=path.lastIndexOf("/");
      var dir=slash>=0?path.substring(0,slash+1):origin+"/";
      return dir+u;
    }
    for(var i=0;i<ln;i++){
      var line=lines[i].trim();
      if(!line||line.startsWith("#")&&line.toLowerCase().startsWith("#extm3u")){continue}
      if(line.startsWith("#EXTGRP:")){curGroup=line.substring(8).trim();continue}
      if(line.startsWith("#EXTINF:")){
        attrs={group:curGroup};
        var rest=line.substring(8);
        var m=rest.match(/([A-Za-z-]+)="([^"]*)"/g);
        if(m){m.forEach(function(a){var p=a.indexOf("=");attrs[a.substring(0,p)]=a.substring(p+2,a.length-1)});}
        var comma=rest.lastIndexOf(",");
        attrs.name=comma>=0?rest.substring(comma+1).trim():rest.trim();
        continue;
      }
      if(line.startsWith("#"))continue;
      var url=resolve(line);
      var ch={id:channels.length,name:attrs.name||url.split("/").pop()||url,url:url,logo:attrs["tvg-logo"]||"",group:attrs["tvg-group-title"]||attrs["group"]||"Senza gruppo"};
      channels.push(ch);
      attrs={};
    }
    buildGroups();
    openGroup("");
    showPlayer();
  }

  function buildGroups(){
    var map={};
    channels.forEach(function(c){map[c.group]=true});
    groups=Object.keys(map).sort(function(a,b){return a.localeCompare(b,"it")});
  }

  function openGroup(g){
    currentGroup=g;
    renderGroups();
    render();
  }

  function renderGroups(){
    var box=document.getElementById("groups");box.innerHTML="";
    var all=document.createElement("button");
    all.className="g"+(currentGroup===""?" on":"");all.setAttribute("data-g","");
    all.textContent="🗂 Tutti";
    box.appendChild(all);
    groups.forEach(function(g){
      var b=document.createElement("button");
      b.className="g"+(currentGroup===g?" on":"");
      b.setAttribute("data-g",g);
      b.textContent=g;
      box.appendChild(b);
    });
  }

  function render(){
    var q=(document.getElementById("search").value||"").toLowerCase();
    var box=document.getElementById("channels");box.innerHTML="";
    filters={};
    channels.forEach(function(c){
      if(currentGroup!==""&&c.group!==currentGroup)return;
      if(q&&c.name.toLowerCase().indexOf(q)<0)return;
      var el=document.createElement("div");
      el.className="ch";el.setAttribute("data-id",c.id);
      if(filters[c.group]===undefined)filters[c.group]=0;
      var img=document.createElement("img");
      img.alt="";
      if(c.logo)img.src=c.logo;
      var b=document.createElement("b");b.textContent=c.name;
      el.appendChild(img);el.appendChild(b);
      box.appendChild(el);
    });
  }

  var IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  function hlsVariant(u){
    var m=u.match(/(\d+)$/);if(m)return u.substring(0,u.length-m[0].length)+m[0]+".m3u8";
    return u.replace(/\.(ts|m2ts)$/i,".m3u8");
  }

  function play(ch){
    window.__llchan=ch;
    ["#empty"].forEach(function(id){document.getElementById(id).style.display="none"});
    document.querySelectorAll(".ch").forEach(function(el){el.classList.remove("playing")});
    var cards=document.querySelectorAll(".ch");
    cards.forEach(function(el){if(+el.getAttribute("data-id")===ch.id)el.classList.add("playing")});
    clearInterval(window.__retry);
    window.__retries=0;
    var v=document.getElementById("video");
    var origin=location.protocol||"https:";
    if(/^http:\/\//i.test(ch.url)&&origin==="https:"){showError("📛 Canale <b>http://</b> su pagina HTTPS bloccato dal browser (Mixed Content). Apri questo player dal box: app → Web Server → http://IP:8080/player, oppure usa una playlist HTTPS.");return}
    if(window.__hls)window.__hls.destroy();
    if(IOS)tryIos(ch,v);
    else tryBrowser(ch,v);
  }

  function tryIos(ch,v){
    var keep=function(){
      showError("🚫 Canale non avviato. Il server non risponde oppure non supporta HLS per questo canale.");
    };
    if(window.__retries>=2){keep();return}
    var u=window.__retries===0?ch.url:hlsVariant(ch.url);
    window.__retries++;
    v.onerror=function(){v.onerror=null;if(/\.m3u8/i.test(u))keep();else tryIos(ch,v)};
    v.src=u;
    v.play().catch(function(){if(/\.m3u8/i.test(u))keep();else tryIos(ch,v)});
  }

  function tryBrowser(ch,v){
    var src=ch.url;
    var keep=function(){showError("🚫 Errore canale (codice "+v.error.code+"): il server non risponde oppure blocca il browser (User-Agent). Prova un altro canale.")};
    if(window.Hls&&Hls.isSupported()&&/\.m3u8/i.test(src)){
      var h=new Hls({enableWorker:false});
      h.on(Hls.Events.ERROR,function(ev,data){
        if(data.fatal)showError("🚫 Errore canale (HLS): "+(data.type||"")+" "+(data.details||""));
      });
      h.loadSource(src);h.attachMedia(v);
      window.__hls=h;
      v.play().catch(function(){});
      return;
    }
    v.onerror=function(){v.onerror=null;keep()};
    v.src=src;
    v.play().catch(keep);
  }

  function showError(txt){
    var e=document.getElementById("empty");
    e.style.display="block";
    var b=e.querySelector("b");b.className="err";b.textContent="";
    b.innerHTML=txt;
  }

  function isSafariSource(u){
    return /\.m3u8/i.test(u)&&(/(iPhone|iPad|iPod|Mac OS X)/i.test(navigator.userAgent));
  }

  function showPlayer(){document.getElementById("empty").style.display="none"}

  function stopLL(){
    try{if(window.__pc)window.__pc.close()}catch(e){}
    window.__pc=null;
    try{var v=document.getElementById("video");if(v.srcObject){v.srcObject.getTracks().forEach(function(t){t.stop()});v.srcObject=null}}catch(e){}
    var b=document.getElementById("llbtn");b.className="ll";
  }
  function startLL(ch,whep){
    if(window.__pc)stopLL();
    var v=document.getElementById("video");
    var pc=new RTCPeerConnection({iceServers:[]});
    window.__pc=pc;
    pc.addTransceiver("video",{direction:"recvonly"});
    pc.addTransceiver("audio",{direction:"recvonly"});
    pc.ontrack=function(ev){if(ev.streams&&ev.streams[0]){v.srcObject=ev.streams[0];v.play().catch(function(){})}};
    pc.oniceconnectionstatechange=function(){if(pc.iceConnectionState==="failed"){stopLL();showError("🚫 WebRTC: nessun percorso ICE. Controlla IP/porta WHEP.")}};
    pc.createOffer().then(function(o){return pc.setLocalDescription(o)}).then(function(){
      return fetch(whep,{method:"POST",headers:{"Content-Type":"application/sdp"},body:pc.localDescription.sdp});
    }).then(function(resp){
      if(!resp.ok)throw new Error("HTTP "+resp.status);
      var iceUrl=resp.headers.get("Location");
      return resp.text().then(function(body){return{body:body,iceUrl:iceUrl}});
    }).then(function(d){
      pc.setRemoteDescription(new RTCSessionDescription({type:"answer",sdp:d.body}));
      if(d.iceUrl){pc.onicecandidate=function(e){if(e.candidate)fetch(d.iceUrl,{method:"POST",headers:{"Content-Type":"application/trickle-ice-sdpfrag"},body:e.candidate.candidate}).catch(function(){})}}
      var b=document.getElementById("llbtn");b.className="ll on";
    }).catch(function(e){stopLL();showError("🚫 WebRTC error: "+e.message)});
  }
  document.getElementById("llbtn").addEventListener("click",function(){
    if(window.__pc){stopLL();return}
    if(!window.__llurl){
      window.__llurl=prompt("URL WHEP del server WebRTC (es. http://IP:8889/sport/whep — per la modalità automatica usa il player dal box: app → Web Server → http://IP:8080/player):",localStorage.getItem("whep")||"");
      if(window.__llurl)localStorage.setItem("whep",window.__llurl);
      else return;
    }
    if(window.__llchan)startLL(window.__llchan,window.__llurl);
    else showError("⚡ Seleziona prima un canale.");
  });

  applyLang();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</body>
</html>
